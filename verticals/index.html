<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-team för din bransch · Agent Team Builder</title>
<meta name="description" content="Se hur ett skräddarsytt AI-team skulle se ut för just er bransch — vilka agenter, vilka jobb, var tiden vinns." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../site/showcase.css" />
<style>
  /* nav + knappar (samma som hubben — ligger inte i designsystemet) */
  .hubnav { position: sticky; top: 0; z-index: 50; background: rgba(10,10,15,0.72); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .hubnav .inner { max-width: 1080px; margin: 0 auto; padding: 13px 24px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .hubnav .home { font-weight: 700; font-size: 14px; margin-right: auto; display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .hubnav a.np { font-size: 13px; color: var(--text-dim); text-decoration: none; padding: 6px 13px; border-radius: 100px; border: 1px solid transparent; transition: color .2s, border-color .2s, background .2s; }
  .hubnav a.np:hover { color: var(--text); border-color: var(--border); background: var(--surface); }
  .hubnav a.nav-cta { color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-radius: 100px; padding: 7px 15px; font-weight: 600; font-size: 13px; text-decoration: none; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
  .btn-lg { display: inline-flex; align-items: center; gap: 9px; padding: 15px 28px; border-radius: 12px; font-weight: 700; font-size: 15.5px; text-decoration: none; transition: transform .15s, box-shadow .2s, border-color .2s; }
  .btn-primary-lg { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; }
  .btn-primary-lg:hover { transform: translateY(-2px); box-shadow: 0 16px 38px -16px var(--accent-glow); }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); transform: translateY(-2px); }
  .backline { display: inline-block; color: var(--text-dim); text-decoration: none; font-size: 13px; margin-bottom: 18px; }
  .backline:hover { color: var(--text); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../avatars.js"></script>
<script src="verticals.js"></script>
<script src="app.js"></script>
</body>
</html>
