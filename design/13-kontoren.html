<title>Kontoren</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Skiss 13 (2026-10-23): SP16 i ROADMAP.md — "Kontoren är vyerna".
   Portalen som rum i stället för paneler. VD-kontoret är kundens eget rum,
   VD-assistentens kontor är där man pratar, och planritningen över våningen
   ersätter agentlistan. Läser kandidaten ur skiss 12 (localStorage
   atb_skiss_anstalld). Demo-växeln i hörnet visar nivå 1 och 3.
   Adressparametrar för skärmbilder: ?niva=3&rum=assistent. Deployas inte. */
:root{
  --sand:#F1ECE3; --papper:#FCFAF6; --blak:#1E1913; --mjuk:#5E554A; --linje:#DDD4C6;
  --ockra:#A9741F; --ockra-2:#8A5C14; --stampel:#9C3B2E; --salvia:#4F7A54;
  --slackt:#2B241C; --slackt-text:#B9AE9C; --golv:#E8E1D5;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --brod:"Karla","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sand);color:var(--blak);font:16px/1.55 var(--brod);-webkit-font-smoothing:antialiased;padding-bottom:64px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ockra);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.08;margin:0}
p{margin:0}
.etikett{font:500 .7rem/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ockra-2)}
.dim{color:var(--mjuk)}
.knapp{background:var(--blak);color:var(--papper);border:0;border-radius:6px;padding:11px 18px;font-weight:700}
.knapp:hover{background:#3a3128}
.knapp-ghost{background:transparent;border:1px solid var(--linje);border-radius:6px;padding:8px 14px;font-weight:700;color:var(--blak)}
.knapp-ghost:hover{border-color:var(--ockra)}
.liten{font-size:.86rem;padding:7px 12px}

/* ---------- toppen ---------- */
.topp{position:sticky;top:0;z-index:20;background:var(--sand);border-bottom:1px solid var(--linje)}
.topp-inre{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.marke{font:800 1.02rem var(--display);display:flex;align-items:center;gap:10px;letter-spacing:-.01em;min-width:0}
.marke::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ockra);flex:none}
.marke span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topp .var{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mjuk);margin-left:auto;white-space:nowrap}
.planknapp{display:none;white-space:nowrap;flex:none;margin-left:auto;border:1px solid var(--linje);background:var(--papper);border-radius:6px;padding:6px 10px;font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- ramen ---------- */
.sida{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

/* ---------- planritningen ---------- */
.plan{align-self:start;position:sticky;top:74px;display:grid;gap:12px}
.plan-rubrik{display:flex;justify-content:space-between;align-items:baseline}
.plan-rubrik b{font:800 1.05rem var(--display)}
.ritning{background:var(--papper);border:1px solid var(--blak);border-radius:6px;padding:10px;
  display:grid;grid-template-columns:1fr 26px 1fr;grid-template-rows:repeat(4,auto);gap:0}
.korridor{grid-column:2;grid-row:1/5;background:var(--golv);border-inline:1px solid var(--blak);display:grid;place-items:center}
.korridor span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 .58rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mjuk)}
.rumknapp{position:relative;min-height:92px;text-align:left;border:0;border-bottom:1px solid var(--blak);background:var(--papper);
  padding:9px 9px 8px;display:grid;align-content:space-between;gap:6px}
.rumknapp.v{grid-column:1;grid-row:var(--r)}
.rumknapp.h{grid-column:3;grid-row:var(--r)}
.rumknapp:nth-last-child(-n+2){border-bottom:0}
/* dörren: en lucka i väggen mot korridoren */
.rumknapp::after{content:"";position:absolute;top:22px;width:3px;height:26px;background:var(--linje)}
.rumknapp.v::after{right:-2px}
.rumknapp.h::after{left:-2px}
.rumknapp.bebott::after{background:var(--ockra)}
.rumknapp .skylt{font:500 .6rem/1.25 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mjuk)}
.rumknapp .vem{display:flex;align-items:center;gap:7px;font:700 .86rem/1.1 var(--display)}
.rumknapp .vem img{width:30px;height:30px;border-radius:4px;object-fit:cover;flex:none;border:1px solid var(--linje)}
.rumknapp:hover{background:#F7F2E9}
.rumknapp .initial{width:30px;height:30px;border-radius:4px;background:var(--blak);color:var(--papper);display:grid;place-items:center;font:800 .9rem var(--display);font-style:normal;flex:none}
.rumknapp.har{background:#F4EBDB;box-shadow:inset 0 0 0 2px var(--ockra)}
.rumknapp.har .skylt::after{content:" · här";color:var(--ockra-2)}
.rumknapp.slackt{background:var(--slackt);color:var(--slackt-text);cursor:default}
.rumknapp.slackt:hover{background:var(--slackt)}
.rumknapp.slackt .skylt{color:var(--slackt-text)}
.rumknapp.slackt .vem{font:500 .66rem/1.3 var(--mono);letter-spacing:.04em;text-transform:none;color:#8F8574}
.rumknapp.slackt .namnskylt{display:inline-block;border:1px solid #5A4F40;border-radius:3px;padding:2px 6px;font:500 .62rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#D8CCB6}
.rumknapp.kanslas{background:var(--slackt);cursor:pointer}
.rumknapp.kanslas:hover{background:#3A3126}
.rumknapp.kanslas .namnskylt{border-color:var(--ockra);color:#E9C98F}
.rumknapp.gemensamt{background:var(--golv)}
.rumknapp.gemensamt:hover{background:var(--golv)}
.rumknapp.gemensamt{cursor:default}
.plan-not{font-size:.86rem;color:var(--mjuk)}
.plan-not b{color:var(--blak)}
.plan-fot{display:flex;gap:14px;flex-wrap:wrap;font:500 .62rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mjuk)}
.plan-fot i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- rummen ---------- */
.rum{display:grid;gap:0;border:1px solid var(--linje);border-radius:6px;overflow:hidden;background:var(--papper);min-width:0}
.rum-huvud{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--linje)}
.rum-huvud h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.rum-huvud .dim{font-size:.95rem;margin-top:4px}

/* väggen */
.vagg{background:var(--sand);padding:22px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--blak)}
.massing{background:var(--ockra);color:var(--papper);border:1px solid var(--ockra-2);border-radius:4px;padding:12px 26px;position:relative;min-width:230px}
.massing::before,.massing::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:var(--ockra-2);transform:translateY(-50%)}
.massing::before{left:9px}.massing::after{right:9px}
.massing small{display:block;font:500 .62rem var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.massing b{display:block;font:800 1.2rem/1.15 var(--display);margin-top:3px}
.massing span{display:block;font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.diplom-rad{display:flex;gap:10px;flex-wrap:wrap}
.diplom{background:var(--papper);border:1px solid var(--blak);outline:1px solid var(--blak);outline-offset:-5px;padding:12px 14px;width:132px;text-align:center}
.diplom small{display:block;font:500 .56rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ockra-2)}
.diplom b{display:block;font:800 .88rem/1.15 var(--display);margin:4px 0}
.diplom span{font:500 .58rem var(--mono);letter-spacing:.06em;color:var(--mjuk)}
.diplom.ny{animation:hangs .6s cubic-bezier(.2,.9,.25,1.2)}
@keyframes hangs{from{transform:translateY(-14px) rotate(-3deg);opacity:0}}
.vagg-not{flex-basis:100%;font-size:.88rem;color:var(--mjuk)}
.vagg-not b{color:var(--blak)}

/* skrivbordet */
.skrivbord{padding:22px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.nasta{grid-row:span 2;border:1px solid var(--blak);border-radius:6px;padding:22px;display:grid;gap:14px;background:var(--papper)}
.nasta h2{font-size:clamp(1.35rem,2.4vw,1.75rem)}
.nasta .vem{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--mjuk)}
.nasta .vem img{width:36px;height:36px;border-radius:4px;object-fit:cover}
.nasta .vem b{color:var(--blak)}
.nasta .rad{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nasta.klart{border-style:dashed;border-color:var(--linje)}

.hog{border:0;background:none;padding:0 10px 10px 0;text-align:left;position:relative;width:100%}
.hog .ark{position:relative;background:var(--papper);border:1px solid var(--linje);border-radius:4px;padding:14px 16px;display:grid;gap:4px;z-index:2}
.hog::before,.hog::after{content:"";position:absolute;background:var(--papper);border:1px solid var(--linje);border-radius:4px;inset:0 10px 10px 0}
.hog::before{transform:translate(8px,8px) rotate(1.4deg);z-index:0}
.hog::after{transform:translate(4px,4px) rotate(-.8deg);z-index:1}
.hog.tom::before,.hog.tom::after{display:none}
.hog .ark b{font:700 1rem var(--display)}
.hog .ark span{font-size:.88rem;color:var(--mjuk)}
.hog:hover .ark{border-color:var(--ockra)}
.raknare{position:absolute;right:2px;top:-8px;z-index:3;background:var(--blak);color:var(--papper);font:500 .64rem var(--mono);letter-spacing:.06em;border-radius:999px;padding:2px 8px}

.gunnar{justify-self:start;margin:6px 0 0 8px;width:214px;background:#F6F0E4;border:1px solid var(--linje);border-radius:5px;padding:9px;display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;transform:rotate(-6deg);position:relative}
.gunnar img{width:42px;height:42px;object-fit:cover;border-radius:3px;filter:grayscale(.55)}
.gunnar b{font:700 .9rem var(--display);display:block}
.gunnar small{font:500 .58rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mjuk)}
.gunnar em{position:absolute;right:-14px;top:-12px;font:800 .7rem var(--display);font-style:normal;letter-spacing:.1em;color:var(--stampel);border:2px solid var(--stampel);border-radius:3px;padding:1px 6px;text-transform:uppercase;transform:rotate(-12deg);background:rgba(246,240,228,.7)}
.gunnar-bildtext{font-size:.8rem;color:var(--mjuk);margin:14px 0 0 8px;max-width:30ch}

.utkast{grid-column:1/-1;display:grid;gap:10px}
.utkast-rad{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--linje);border-radius:6px;padding:12px 14px;background:var(--papper);position:relative}
.utkast-rad img{width:40px;height:40px;border-radius:4px;object-fit:cover}
.utkast-rad b{font:700 .98rem var(--display);display:block}
.utkast-rad p{font-size:.88rem;color:var(--mjuk)}
.utkast-rad .knappar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.utkast-rad.fokus{border-color:var(--blak)}
.utkast-rad.godkand{opacity:.55}
.utkast-rad .stampel{position:absolute;right:18px;top:50%;font:800 .9rem var(--display);letter-spacing:.1em;color:var(--salvia);border:2px solid var(--salvia);border-radius:3px;padding:1px 8px;text-transform:uppercase;transform:translateY(-50%) rotate(-8deg);background:var(--papper)}
.utkast-rad .not{grid-column:2/-1;font-size:.86rem;color:var(--ockra-2)}

/* låsta saker */
.last{border-top:1px solid var(--linje);padding:18px 22px 22px;display:grid;gap:10px;background:var(--papper)}
.last ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.last li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--linje);font-size:.94rem}
.last li:first-child{border-top:0}
.last li svg{margin-top:3px}
.last li b{font-weight:700}
.last li span{color:var(--mjuk)}

/* ---------- VD-assistentens kontor ---------- */
.ass-vagg{background:var(--sand);padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;border-bottom:1px solid var(--blak)}
.ass-portratt{width:150px;background:var(--papper);border:1px solid var(--linje);border-radius:6px;padding:8px 8px 10px;display:grid;gap:8px}
.ass-portratt .strip{height:4px;background:var(--ockra);border-radius:2px}
.ass-portratt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;filter:saturate(.92)}
.ass-portratt b{font:800 1.05rem/1 var(--display)}
.ass-portratt small{font:500 .58rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mjuk)}
.ass-text h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.ass-text p{color:var(--mjuk);margin-top:6px;max-width:58ch}
.ass-text .status{margin-top:10px;font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--salvia)}
.ass-text .status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--salvia);margin-right:7px}
.ass-golv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.ass-v{border-right:1px solid var(--linje);display:grid;align-content:start}
.samtal{display:grid;grid-template-rows:auto auto auto;border-bottom:1px solid var(--linje)}
.sektion-rubrik{padding:14px 22px;border-bottom:1px solid var(--linje);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sektion-rubrik b{font:800 1.05rem var(--display)}
.logg{padding:18px 22px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;height:400px}
.repl{max-width:88%;display:grid;gap:3px}
.repl small{font:500 .6rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mjuk)}
.repl p{border:1px solid var(--linje);background:var(--sand);border-radius:6px;padding:10px 13px;font-size:.96rem}
.repl.jag{align-self:flex-end;text-align:right}
.repl.jag p{background:var(--papper);border-color:var(--blak);text-align:left}
.repl.ny{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.skriv{border-top:1px solid var(--linje);padding:12px 22px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.skriv textarea{font:inherit;resize:none;height:46px;padding:11px 12px;border:1px solid var(--linje);border-radius:6px;background:var(--sand);min-width:0}
.skriv textarea:focus{outline:none;border-color:var(--ockra)}
.sida-h{display:grid;align-content:start}
.mote{padding:18px 22px;display:grid;gap:12px}
.mote ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.mote li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:.92rem}
.mote li small{font:500 .62rem/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mjuk)}
.rekr{padding:18px 22px 22px;display:grid;gap:12px}
.rekr ol{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:plan}
.rekr li{display:grid;grid-template-columns:24px 38px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--linje);align-items:start}
.rekr li:first-child{border-top:0}
.rekr li::before{counter-increment:plan;content:counter(plan);font:500 .72rem var(--mono);color:var(--mjuk);padding-top:3px}
.rekr li img{width:38px;height:38px;border-radius:4px;object-fit:cover;border:1px solid var(--linje)}
.rekr li .tom{width:38px;height:38px;border-radius:4px;border:1px dashed #B9AE9C;background:var(--slackt)}
.rekr li b{font:700 .95rem/1.2 var(--display);display:block}
.rekr li p{font-size:.86rem;color:var(--mjuk);margin-top:2px}
.rekr li .lage{display:inline-block;margin-top:5px;font:500 .6rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mjuk)}
.rekr li .lage.in{color:var(--salvia)}
.rekr li .lage.nu{color:var(--ockra-2)}
.rekr li.avvisad{opacity:.85}
.rekr li.avvisad::before{content:"–"}
.rekr li.avvisad b{text-decoration:line-through;text-decoration-color:var(--stampel);text-decoration-thickness:2px;color:var(--mjuk)}
.rekr li .anstall{margin-top:8px}
.alla{display:grid;gap:8px;border-top:1px solid var(--blak);padding-top:14px}
.alla p{font-size:.86rem;color:var(--mjuk)}
.bekrafta{border:1px solid var(--blak);border-radius:6px;padding:12px;display:grid;gap:10px;background:var(--sand)}

/* ---------- enkla rum: specialist och mötesrum ---------- */
.enkelt{padding:22px;display:grid;gap:18px}
.passerkort{width:min(260px,100%);background:var(--papper);border:1px solid var(--linje);border-radius:6px;overflow:hidden}
.passerkort .strip{height:5px;background:var(--ockra)}
.passerkort img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.passerkort div{padding:12px 14px}
.passerkort b{font:800 1.25rem var(--display);display:block}
.passerkort small{font:500 .62rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mjuk)}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.fakta{display:grid;gap:14px}
.fakta div{border-top:1px solid var(--linje);padding-top:10px}
.fakta p{margin-top:4px}
.motestyper{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.motestyp{border:1px solid var(--linje);border-radius:6px;padding:14px;display:grid;gap:6px;background:var(--papper)}
.motestyp b{font:700 1rem var(--display)}
.motestyp p{font-size:.88rem;color:var(--mjuk)}
.bord-runt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bord-runt img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--papper);box-shadow:0 0 0 1px var(--linje)}

/* ---------- demo-växeln ---------- */
.vaxel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--papper);border:1px solid var(--linje);border-radius:6px;padding:7px 8px 7px 12px;display:flex;align-items:center;gap:8px;
  font:500 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mjuk);box-shadow:0 10px 24px -18px rgba(30,25,19,.6)}
.vaxel button{border:1px solid var(--linje);background:var(--sand);border-radius:4px;padding:4px 9px;font:500 .64rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
.vaxel button[aria-pressed=true]{background:var(--blak);color:var(--papper);border-color:var(--blak)}
.vaxel .sep{width:1px;height:16px;background:var(--linje)}

.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:31;background:var(--blak);color:var(--papper);border-radius:6px;padding:10px 16px;font-size:.92rem;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .3s}
.toast.syns{opacity:1}

/* ---------- smalare skärmar ---------- */
@media (max-width:1180px){
  .ass-golv{grid-template-columns:1fr}
  .ass-v{border-right:0;border-bottom:1px solid var(--linje)}
  .logg{height:auto;max-height:380px}
}
@media (max-width:980px){
  .skrivbord{grid-template-columns:1fr}
  .nasta{grid-row:auto}
}
@media (max-width:860px){
  .sida{grid-template-columns:1fr;gap:16px;padding-top:14px}
  .planknapp{display:inline-block}
  .topp .var{display:none}
  .plan{position:static;display:none}
  .plan.oppen{display:grid}
  /* planritningen blir en lista: ett rum per rad, dörren till vänster */
  .ritning{grid-template-columns:1fr;padding:0;border-color:var(--linje)}
  .korridor{display:none}
  .rumknapp.v,.rumknapp.h{grid-column:1;min-height:0;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:11px 12px 11px 18px;border-bottom:1px solid var(--linje)}
  .rumknapp:nth-last-child(-n+2){border-bottom:1px solid var(--linje)}
  .rumknapp:last-child{border-bottom:0}
  .rumknapp.v::after,.rumknapp.h::after{left:0;right:auto;top:10px;bottom:10px;height:auto;width:4px}
  .rumknapp .vem{justify-content:flex-end;text-align:right}
  .rumknapp.slackt{grid-template-columns:1fr;gap:4px}
  .rumknapp.slackt .vem{justify-content:flex-start;text-align:left}
  .rumknapp .vem img{width:26px;height:26px}
  .rumknapp.v,.rumknapp.h{grid-row:auto}
  .ritning .ordning{order:var(--o)}
}
@media (max-width:560px){
  .rum-huvud,.vagg,.skrivbord,.last,.enkelt,.mote,.rekr{padding-left:16px;padding-right:16px}
  .sektion-rubrik,.logg,.skriv{padding-left:16px;padding-right:16px}
  .ass-vagg{grid-template-columns:1fr;padding:16px}
  .ass-portratt{width:100%;grid-template-columns:84px minmax(0,1fr);align-items:center}
  .ass-portratt .strip{grid-column:1/-1}
  .massing{min-width:0;flex:1 1 100%}
  .diplom{width:calc(33.33% - 7px);min-width:96px;padding:10px 8px}
  .utkast-rad{grid-template-columns:34px minmax(0,1fr)}
  .utkast-rad img{width:34px;height:34px}
  .utkast-rad .knappar{grid-column:1/-1;justify-content:flex-start}
  .mote li{grid-template-columns:1fr;gap:2px}
  .spec{grid-template-columns:1fr}
  .repl{max-width:94%}
  .vaxel{left:max(12px,env(safe-area-inset-left,0px));right:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="topp">
  <div class="topp-inre">
    <span class="marke"><span id="firmaTopp">Lindqvists Bygg</span></span>
    <button class="planknapp" id="planknapp" type="button" aria-expanded="false" aria-controls="plan">Våningen<span id="planknappRum" hidden></span></button>
    <span class="var" id="toppVar">Plan 2 · VD-kontoret</span>
  </div>
</header>

<div class="sida">
  <nav class="plan" id="plan" aria-label="Våningen">
    <div class="plan-rubrik"><b>Våningen</b><span class="etikett" id="planEtikett">Plan 2</span></div>
    <div class="ritning" id="ritning"></div>
    <p class="plan-not" id="planNot"></p>
    <div class="plan-fot"><span><i style="background:var(--ockra)"></i>bebott</span><span><i style="background:var(--slackt)"></i>släckt · kommer enligt planen</span></div>
  </nav>
  <main class="rum" id="rum" tabindex="-1" aria-live="polite"></main>
</div>

<div class="vaxel" role="group" aria-label="Skissens demo-växel">
  <span>Skiss · nivå</span>
  <button type="button" data-niva="1" aria-pressed="true">1</button>
  <button type="button" data-niva="3" aria-pressed="false">3</button>
  <span class="sep"></span>
  <button type="button" id="nollstall" title="Börja om skissen">Om</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---------- porträtt: samma logik som skiss 12 ----------
  const LOKAL = location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const BAS = LOKAL ? "../portal/avatars/" : "avatars/";
  const bild = (n) => BAS + "avatar-" + String(n).padStart(2, "0") + ".png";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- kandidaten ur öppningsscenen (skiss 12) ----------
  const STD = { chef: "Kim", firma: "Lindqvists Bygg", namn: "Robin", avatarN: 14, gunnarN: 3 };
  let lagrat = {};
  try { lagrat = JSON.parse(localStorage.getItem("atb_skiss_anstalld") || "{}") || {}; } catch { lagrat = {}; }
  const ren = (v, fallback, max) => (typeof v === "string" && v.trim() ? v.trim().slice(0, max) : fallback);
  const heltal = (v, fallback) => (Number.isInteger(v) && v >= 1 && v <= 25 ? v : fallback);
  const P = {
    // Scen 12 sparar "chefen"/"Firman" när fälten lämnas tomma; då gäller skissens standard.
    chef: ren(lagrat.chef === "chefen" ? "" : lagrat.chef, STD.chef, 30),
    firma: ren(lagrat.firma === "Firman" ? "" : lagrat.firma, STD.firma, 40),
    namn: ren(lagrat.namn, STD.namn, 24),
    avatarN: heltal(lagrat.avatarN, STD.avatarN),
    gunnarN: heltal(lagrat.gunnarN, STD.gunnarN),
  };

  // Specialisternas porträtt: människor, aldrig samma som assistenten eller Gunnar.
  const MANNISKOR = [11, 16, 20, 5, 8, 1, 2, 4, 6, 9, 12, 15, 17, 18, 21, 23, 25];
  const upptagna = new Set([P.avatarN, P.gunnarN]);
  const nastaPortratt = () => { const n = MANNISKOR.find((x) => !upptagna.has(x)); upptagna.add(n); return n; };

  // ---------- rekryteringsplanen (ur "researchen") ----------
  const PLAN = [
    { id: "offert", roll: "Offertskrivaren", namn: "Bertil", av: nastaPortratt(),
      skal: "Ni lägger sex timmar i veckan på offerter, mest på kvällarna.",
      krav: "Flyttar in när första projektet är påbörjat",
      uppdrag: "Räkna om offerten till Brf Tallen med de nya plåtpriserna.",
      leverans: "Offert, Brf Tallen: takomläggning 140 m². Väntar på ert godkännande." },
    { id: "faktura", roll: "Fakturapåminnaren", namn: "Nora", av: nastaPortratt(),
      skal: "ÄTA-arbeten faktureras sent. I våras låg 41 000 kr ofakturerade i över en månad.",
      krav: "Flyttar in när Bertils första leverans är godkänd",
      uppdrag: "Gå igenom vilka avslutade jobb som inte är fakturerade än.",
      leverans: "Påminnelse till Hägg Fastigheter, faktura 1043. Skickad efter ert ja." },
    { id: "kund", roll: "Kundsvararen", namn: "Ines", av: nastaPortratt(),
      skal: "Kunder ringer medan ni står på en ställning. Ni ringer tillbaka på kvällen, nio samtal i veckan.",
      krav: "Flyttar in när rutinerna suttit i tre veckor",
      uppdrag: "Skriv svar till de tre som ringde i går och lämnade meddelande.",
      leverans: "Tre svarsutkast. Ett av dem säger nej till ett jobb, vänligt." },
  ];
  const AVVISADE = [
    { roll: "Marknadsföraren", varfor: "Inte än: ni har fler förfrågningar än ni hinner svara på." },
    { roll: "Bokföraren", varfor: "Inte än: er redovisningsbyrå sköter det, och sköter det bra." },
    { roll: "Sociala medier-redaktören", varfor: `Inte än: ${P.chef} har inte loggat in på Instagram sedan 2019.` },
  ];
  const NIVAER = {
    1: { namn: "Första mötet", datum: "23 okt" },
    2: { namn: "Första anställningen", datum: "4 nov" },
    3: { namn: "Rutinerna sitter", datum: "2 dec" },
  };

  // ---------- tillstånd ----------
  const S = { niva: 1, rum: "vd", anstallda: new Set(), alla: false, godkanda: new Set(), visaUtkast: false, fokusUtkast: null, chatt: [], forifyllt: "", bekrafta: false, svarIndex: 0 };
  function sattNiva(n) {
    S.niva = n; S.alla = false; S.godkanda = new Set(); S.visaUtkast = false; S.fokusUtkast = null; S.bekrafta = false; S.forifyllt = "";
    S.anstallda = new Set(n >= 3 ? ["offert", "faktura"] : []);
    S.chatt = startChatt(); S.svarIndex = 0;
    if (!["vd", "assistent"].includes(S.rum) && !rumOppet(S.rum)) S.rum = "vd";
  }
  const moteOppet = () => S.niva >= 3 || S.alla;
  const anstalld = (id) => S.anstallda.has(id);
  const kanAnstallas = (id) => !anstalld(id) && S.niva >= 3; // nivå 3 låser upp resten av planen
  function rumOppet(rum) {
    if (rum === "mote") return moteOppet();
    if (rum.startsWith("spec:")) return anstalld(rum.slice(5));
    return true;
  }
  const spec = (id) => PLAN.find((p) => p.id === id);
  const gen = (namn) => (/[sxz]$/i.test(namn) ? namn : namn + "s"); // Agnes kontor, Robins kontor

  // ---------- samtalet (förskrivet, ingen AI) ----------
  function startChatt() {
    if (S.niva >= 3) return [
      { vem: "ass", text: `Bertils offert till Brf Tallen ligger på ditt skrivbord. Nora har lagt in betalningsvillkoren: 30 dagar, inte 60 som förra gången.` },
      { vem: "jag", text: "Var det 60 förra gången?" },
      { vem: "ass", text: "Ja. Gunnar skrev det. Jag tror att han ville avsluta samtalet." },
    ];
    return [
      { vem: "ass", text: `God morgon, ${P.chef}. Jag har läst igenom det du sa på intervjun. Offerterna tar mest tid, sex timmar i veckan sa du.` },
      { vem: "jag", text: "Ungefär. Mest på kvällarna." },
      { vem: "ass", text: "Då börjar vi där. Skicka det du har om Brf Tallen, så gör jag ett utkast i dag. När Offertskrivaren flyttar in tar hen över det här." },
    ];
  }
  const SVAR = [
    "Noterat. Det här är en skiss, så jag kan bara några repliker. I portalen svarar jag på riktigt.",
    "Jag lägger det på ditt skrivbord när det är klart. Du ser det i högen med utkast.",
    "Bra. Då tar vi det på veckomötet på måndag, om inget brinner innan dess.",
  ];

  // ---------- planritningen ----------
  function rumLista() {
    const r = [];
    r.push({ id: "vd", sida: "v", o: 1, skylt: "VD-kontoret", vem: `${P.chef} · VD`, av: null, initial: P.chef.charAt(0).toUpperCase(), lage: "bebott" });
    r.push({ id: "assistent", sida: "h", o: 2, skylt: "VD-assistenten", vem: P.namn, av: P.avatarN, lage: "bebott" });
    PLAN.forEach((p, i) => {
      const sida = i % 2 === 0 ? "v" : "h";
      if (anstalld(p.id)) r.push({ id: "spec:" + p.id, sida, o: 3 + i, skylt: p.roll, vem: p.namn, av: p.av, lage: "bebott" });
      else r.push({ id: "spec:" + p.id, sida, o: 3 + i, skylt: "Ledigt rum", vem: p.roll, lage: kanAnstallas(p.id) ? "kanslas" : "slackt", krav: kanAnstallas(p.id) ? "Kan anställas nu" : p.krav });
    });
    r.push(moteOppet()
      ? { id: "mote", sida: "h", o: 6, skylt: "Mötesrummet", vem: "Bokat: inget", lage: "bebott" }
      : { id: "mote", sida: "h", o: 6, skylt: "Mötesrummet", vem: "Låst", lage: "slackt", krav: "Öppnas när rutinerna suttit i tre veckor" });
    r.push({ id: "pentry", sida: "v", o: 7, skylt: "Pentryt", vem: "Kaffemaskinen", lage: "gemensamt" });
    r.push({ id: "entre", sida: "h", o: 8, skylt: "Entrén", vem: "Gunnars plats, tom", lage: "gemensamt" });
    return r;
  }
  // Ordningen i ritningen: vänster och höger varvas rad för rad.
  function ritaPlan() {
    const rum = rumLista();
    const v = rum.filter((x) => x.sida === "v"), h = rum.filter((x) => x.sida === "h");
    const el = $("ritning"); el.innerHTML = '<div class="korridor"><span>Korridoren</span></div>';
    const rader = Math.max(v.length, h.length);
    for (let i = 0; i < rader; i++) [v[i], h[i]].forEach((x, k) => {
      if (!x) { const tom = document.createElement("div"); tom.className = "rumknapp " + (k ? "h" : "v") + " gemensamt"; tom.style.setProperty("--r", i + 1); el.appendChild(tom); return; }
      const b = document.createElement("button");
      b.type = "button"; b.className = `rumknapp ${x.sida} ordning ${x.lage === "bebott" ? "bebott" : x.lage === "kanslas" ? "slackt kanslas" : x.lage}${S.rum === x.id ? " har" : ""}`;
      b.style.setProperty("--r", i + 1); b.style.setProperty("--o", x.o);
      if (S.rum === x.id) b.setAttribute("aria-current", "page");
      if (x.lage === "bebott") {
        b.innerHTML = `<span class="skylt">${esc(x.skylt)}</span><span class="vem">${x.av ? `<img src="${bild(x.av)}" alt="">` : x.initial ? `<i class="initial" aria-hidden="true">${esc(x.initial)}</i>` : ""}${esc(x.vem)}</span>`;
        b.onclick = () => ga(x.id);
      } else if (x.lage === "gemensamt") {
        b.innerHTML = `<span class="skylt">${esc(x.skylt)}</span><span class="vem" style="font:500 .78rem var(--brod);color:var(--mjuk)">${esc(x.vem)}</span>`;
        b.setAttribute("aria-disabled", "true");
        b.onclick = () => toast(x.id === "pentry" ? "Kaffemaskinen har ett ömsesidigt förtroende med Gunnar. Den har inte bestämt sig om resten av er." : "Receptionen är tom sedan Gunnar gick. Ingen saknar skylten ”Åter 13.00”.");
      } else {
        b.innerHTML = `<span class="skylt">${esc(x.skylt)}</span><span class="vem"><span><span class="namnskylt">${esc(x.vem)}</span><br>${esc(x.krav)}</span></span>`;
        b.setAttribute("aria-label", `${x.vem}: släckt rum. ${x.krav}.`);
        b.onclick = () => {
          if (x.lage === "kanslas") { ga("assistent"); setTimeout(() => { const t = document.querySelector(`[data-anstall="${x.id.slice(5)}"]`); if (t) { t.scrollIntoView({ block: "center", behavior: "smooth" }); t.focus({ preventScroll: true }); } }, 60); }
          else toast(`Dörren är låst. ${x.krav}.`);
        };
      }
      el.appendChild(b);
    });
    const antal = 1 + S.anstallda.size;
    $("planNot").innerHTML = `<b>${antal} ${antal === 1 ? "anställd" : "anställda"}</b> och ${esc(P.chef)}. ${PLAN.length - S.anstallda.size ? `${PLAN.length - S.anstallda.size} rum står släckta och väntar på någon ur planen.` : "Alla rum i planen är bebodda."}`;
  }

  // ---------- VD-kontoret ----------
  function utkastLista() {
    const a = { av: P.avatarN, fran: P.namn };
    if (S.niva >= 3) {
      const b = spec("offert"), n = spec("faktura");
      return [
        { id: "u-offert", av: b.av, fran: b.namn, titel: "Offert till Brf Tallen", text: "Takomläggning 140 m², ny plåt, 30 dagars betalning. Ska ut senast fredag." },
        { id: "u-paminn", av: n.av, fran: n.namn, titel: "Påminnelse: Hägg Fastigheter, faktura 1043", text: "Förfallen sedan nio dagar. Vänlig ton, ingen ränta än." },
        { id: "u-mote", ...a, titel: "Anteckning från veckomötet", text: "Tre beslut, ett av dem är att ingen fil får heta ”slutlig” igen." },
      ];
    }
    return [
      { id: "u-tallen", ...a, titel: "Mejl till Brf Tallen", text: "”Offerten kommer på fredag.” Kort, och den här gången stämmer det." },
      { id: "u-moms", ...a, titel: "Påminnelse: momsen 12 november", text: "Lagd i kalendern med två dagars marginal. Gunnar hade velat se det här." },
    ];
  }
  const kvar = () => utkastLista().filter((u) => !S.godkanda.has(u.id));

  function nastaSteg() {
    if (S.niva >= 3) {
      if (!S.godkanda.has("u-offert")) {
        const b = spec("offert");
        return { av: b.av, vem: `${b.namn}, Offertskrivaren`, titel: "Godkänn Bertils offert till Brf Tallen",
          text: "Den ska ut senast fredag. Bertil har räknat på 140 m² takomläggning, Nora har lagt in betalningsvillkoren. Läs den och säg ja eller be om en ändring.",
          knapp: "Läs offerten", gor: () => { S.visaUtkast = true; S.fokusUtkast = "u-offert"; rita(); fokusera("u-offert"); } };
      }
      if (anstalld("kund")) return { av: P.avatarN, vem: `${P.namn}, VD-assistent`, titel: "Håll det första mötet i mötesrummet",
        text: "Hela planen har flyttat in. Samla dem kring Brf Tallen: vad gick bra, vad tog för lång tid. Mötet ska sluta i ett beslut.",
        knapp: "Gå till mötesrummet", gor: () => ga("mote") };
      return { av: P.avatarN, vem: `${P.namn}, VD-assistent`, titel: "Anställ Kundsvararen",
        text: "Offerten är godkänd. Nästa i planen är Kundsvararen: nio samtal i veckan som ni ringer tillbaka på kvällen.",
        knapp: `Gå till ${gen(P.namn)} kontor`, gor: () => ga("assistent") };
    }
    if (!S.forifyllt) {
      return { av: P.avatarN, vem: `${P.namn}, VD-assistent`, titel: `Ge ${P.namn} underlaget till första projektet`,
        text: `Offerten till Brf Tallen ligger halvskriven sedan i torsdags. Skicka det du har, så gör ${P.namn} ett utkast i dag.`,
        knapp: `Gå till ${gen(P.namn)} kontor`, gor: () => { S.forifyllt = "Här är det jag har om Brf Tallen: "; ga("assistent"); } };
    }
    return { klart: true };
  }

  const LAS = `<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="7" width="12" height="8" rx="1.5" fill="none" stroke="#8A5C14" stroke-width="1.4"/><path d="M4 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="#8A5C14" stroke-width="1.4"/></svg>`;
  function lastaSaker() {
    if (S.niva >= 3) return [
      ["Kedjor", "en leverans går vidare till nästa kollega av sig själv", "Låses upp när ett möte lett till ett beslut som blivit en rutin."],
      ["Rutiner som mejlas", "veckans rutiner i inkorgen på måndag morgon", "Samma krav: möte, beslut, rutin."],
      ["Ta med teamet", "exporten till er egen AI", "Låses upp efter ett kvartal i gång."],
    ];
    return [
      ["Veckans rutiner", "stående uppgifter som bockas av", "Låses upp när Offertskrivaren levererat något ni godkänt."],
      ["Mötesrummet", "möten med flera kollegor på en gång", "Låses upp när rutinerna suttit i tre veckor."],
      ["Kedjor och utskick", "leveranser som går vidare av sig själva", "Låses upp när ett möte lett till ett beslut som blivit en rutin."],
    ];
  }

  function vdKontoret() {
    const steg = nastaSteg();
    const u = kvar();
    const alla = utkastLista();
    const niv = NIVAER[S.niva];
    const diplom = [1, 2, 3].filter((n) => n <= S.niva).map((n) =>
      `<div class="diplom${n === S.niva && S.niva > 1 ? " ny" : ""}"><small>Nivå ${n}</small><b>${esc(NIVAER[n].namn)}</b><span>${NIVAER[n].datum}</span></div>`).join("");
    const nastaNiva = S.niva >= 3 ? "<b>Nästa: Teamet samarbetar.</b> Ett möte som leder till ett beslut som blir en rutin." : `<b>Nästa: Första anställningen.</b> Börja första projektet med ${esc(P.namn)}, så flyttar Offertskrivaren in.`;
    return `
      <div class="rum-huvud">
        <div><span class="etikett">Ert rum</span><h1 id="rubrik">VD-kontoret</h1><p class="dim">Här ligger det som väntar på dig, ${esc(P.chef)}. Resten sköter de andra.</p></div>
      </div>
      <div class="vagg" aria-label="Väggen">
        <div class="massing" role="img" aria-label="Mässingsskylt: ${esc(P.firma)}, nivå ${S.niva}, ${esc(niv.namn)}">
          <small>${esc(P.firma)}</small><b>Nivå ${S.niva} · ${esc(niv.namn)}</b><span>Grundat ${NIVAER[1].datum} · ${1 + S.anstallda.size} anställd${S.anstallda.size ? "a" : ""}</span>
        </div>
        <div class="diplom-rad" aria-label="Inramat på väggen">${diplom}</div>
        <p class="vagg-not">${nastaNiva}</p>
      </div>
      <div class="skrivbord" aria-label="Skrivbordet">
        ${steg.klart
          ? `<section class="nasta klart"><span class="etikett">Ert nästa steg</span><h2>Inget mer väntar på dig i dag.</h2><p class="dim">${esc(P.namn)} hör av sig när utkastet är klart. Det hamnar i högen här bredvid.</p></section>`
          : `<section class="nasta" aria-labelledby="nastaH">
              <span class="etikett">Ert nästa steg</span>
              <h2 id="nastaH">${esc(steg.titel)}</h2>
              <p>${esc(steg.text)}</p>
              <div class="vem"><img src="${bild(steg.av)}" alt=""><span>Görs med <b>${esc(steg.vem)}</b></span></div>
              <div class="rad"><button class="knapp" type="button" id="nastaKnapp">${esc(steg.knapp)}</button></div>
            </section>`}
        <div>
          <button class="hog${u.length ? "" : " tom"}" type="button" id="hog" aria-expanded="${S.visaUtkast}" aria-controls="utkast">
            ${u.length ? `<span class="raknare">${u.length} att godkänna</span>` : ""}
            <span class="ark"><span class="etikett">Utkast</span><b>${u.length ? esc(u[0].titel) : "Högen är tom"}</b><span>${u.length ? `Från ${esc(u[0].fran)}${u.length > 1 ? ` och ${u.length - 1} till` : ""}` : "Allt är godkänt. Det har aldrig hänt förut."}</span></span>
          </button>
        </div>
        <div>
          <div class="gunnar" title="Elva år. Fyrtiofyra momspåminnelser."><img src="${bild(P.gunnarN)}" alt=""><div><b>Gunnar</b><small>Assistent 2014–2026</small></div><em>Slutat</em></div>
          <p class="gunnar-bildtext">Gunnars passerkort. Ingen har vågat flytta det.</p>
        </div>
        <div class="utkast" id="utkast" ${S.visaUtkast ? "" : "hidden"}>
          ${alla.map((x) => {
            const ok = S.godkanda.has(x.id);
            return `<div class="utkast-rad${ok ? " godkand" : ""}${S.fokusUtkast === x.id ? " fokus" : ""}" id="${x.id}">
              <img src="${bild(x.av)}" alt=""><div><b>${esc(x.titel)}</b><p>Från ${esc(x.fran)}. ${esc(x.text)}</p></div>
              ${ok ? `<span class="stampel">Godkänd</span>` : `<div class="knappar"><button class="knapp liten" type="button" data-godkann="${x.id}">Godkänn</button><button class="knapp-ghost liten" type="button" data-andra="${x.id}">Be om ändring</button></div>`}
            </div>`;
          }).join("")}
        </div>
      </div>
      <section class="last" aria-labelledby="lastH">
        <span class="etikett" id="lastH">Dörrar som är låsta än</span>
        <ul>${lastaSaker().map(([vad, vadArDet, krav]) => `<li>${LAS}<div><b>${vad}</b> <span>· ${vadArDet}.</span><br><span>${krav}</span></div></li>`).join("")}</ul>
      </section>`;
  }

  // ---------- VD-assistentens kontor ----------
  function assistentensKontor() {
    const mote = S.niva >= 3 ? [
      ["Förra veckan", "Rutinerna bockades av tredje veckan i rad. Två offerter ut, en faktura påmind."],
      ["Den här veckan", "Godkänn Bertils offert till Brf Tallen före fredag."],
      ["Nästa anställning", anstalld("kund") ? "Planen är full. Nästa steg är att teamet arbetar ihop." : "Kundsvararen kan anställas nu."],
    ] : [
      ["Förra veckan", `Gunnar slutade. ${P.namn} anställdes. Ett bra byte, enligt ${P.namn}.`],
      ["Den här veckan", "Första projektet: offerten till Brf Tallen."],
      ["Nästa anställning", "Offertskrivaren, när första projektet är påbörjat."],
    ];
    const planRader = [
      `<li><img src="${bild(P.avatarN)}" alt=""><div><b>${esc(P.namn)}, VD-assistent</b><p>Håller ihop veckan, minns momsen och säger nej ibland.</p><span class="lage in">Anställd ${NIVAER[1].datum}</span></div></li>`,
      ...PLAN.map((p) => {
        if (anstalld(p.id)) return `<li><img src="${bild(p.av)}" alt=""><div><b>${esc(p.namn)}, ${esc(p.roll)}</b><p>${esc(p.skal)}</p><span class="lage in">Anställd · har ett eget rum</span></div></li>`;
        const nu = kanAnstallas(p.id);
        return `<li><span class="tom" aria-hidden="true"></span><div><b>${esc(p.roll)}</b><p>${esc(p.skal)}</p><span class="lage${nu ? " nu" : ""}">${nu ? "Kan anställas nu" : esc(p.krav)}</span>${nu ? `<div class="anstall"><button class="knapp liten" type="button" data-anstall="${p.id}">Anställ ${esc(p.roll)}</button></div>` : ""}</div></li>`;
      }),
      ...AVVISADE.map((a) => `<li class="avvisad"><span aria-hidden="true"></span><div><b>${esc(a.roll)}</b><p>${esc(a.varfor)}</p></div></li>`),
    ].join("");
    const kvarIPlan = PLAN.filter((p) => !anstalld(p.id)).length;
    return `
      <div class="ass-vagg">
        <div class="ass-portratt"><div class="strip"></div><img src="${bild(P.avatarN)}" alt="Porträtt av ${esc(P.namn)}"><div><b>${esc(P.namn)}</b><br><small>VD-assistent · ${esc(P.firma)}</small></div></div>
        <div class="ass-text">
          <span class="etikett">VD-assistentens kontor</span>
          <h1 id="rubrik">${esc(gen(P.namn))} kontor</h1>
          <p>Här pratar ni. Om veckan, om det som skaver, och om vem som ska anställas härnäst. ${esc(P.namn)} har ett anteckningsblock, och använder det.</p>
          <p class="status">På plats · dörren står öppen</p>
        </div>
      </div>
      <div class="ass-golv">
        <div class="ass-v">
        <section class="samtal" aria-labelledby="samtalH">
          <div class="sektion-rubrik"><b id="samtalH">Samtalet</b><span class="etikett">Bara ni två</span></div>
          <div class="logg" id="logg">${S.chatt.map((m) => repl(m)).join("")}</div>
          <form class="skriv" id="skriv">
            <label for="skrivText" style="position:absolute;left:-9999px">Skriv till ${esc(P.namn)}</label>
            <textarea id="skrivText" placeholder="Skriv till ${esc(P.namn)} …">${esc(S.forifyllt)}</textarea>
            <button class="knapp" type="submit">Skicka</button>
          </form>
        </section>
          <section class="mote" aria-labelledby="moteH">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b id="moteH" style="font:800 1.05rem var(--display)">Veckomötet</b><span class="etikett">Måndag 08:00 · tio minuter</span></div>
            <ol>${mote.map(([k, t]) => `<li><small>${k}</small><span>${esc(t)}</span></li>`).join("")}</ol>
            <div><button class="knapp-ghost" type="button" id="motesKnapp">Börja veckomötet</button></div>
          </section>
        </div>
        <div class="sida-h">
          <section class="rekr" aria-labelledby="rekrH">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b id="rekrH" style="font:800 1.05rem var(--display)">Rekryteringsplanen</b><span class="etikett">En i taget</span></div>
            <p class="dim" style="font-size:.88rem">Ur det ni berättade på intervjun. Överstrukna är förslag som fick ett nej, för nu.</p>
            <ol>${planRader}</ol>
            ${kvarIPlan ? `<div class="alla">
              ${S.bekrafta
                ? `<div class="bekrafta"><p>Då flyttar ${kvarIPlan === 1 ? "en till" : `alla ${kvarIPlan}`} in i dag. Det går bra, men ni hinner inte lära känna dem en i taget.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="knapp liten" type="button" id="allaJa">Ja, anställ alla</button><button class="knapp-ghost liten" type="button" id="allaNej">Nej, en i taget</button></div></div>`
                : `<p>Vill ni hellre ha hela teamet direkt? Det går.</p><div><button class="knapp-ghost liten" type="button" id="alla">Anställ alla nu</button></div>`}
            </div>` : ""}
          </section>
        </div>
      </div>`;
  }
  function repl(m, ny) {
    const ass = m.vem === "ass";
    return `<div class="repl${ass ? "" : " jag"}${ny ? " ny" : ""}"><small>${esc(ass ? P.namn : P.chef)}</small><p>${esc(m.text)}</p></div>`;
  }
  function sag(text, vem = "ass") {
    S.chatt.push({ vem, text });
    const logg = $("logg");
    if (logg) { logg.insertAdjacentHTML("beforeend", repl({ vem, text }, true)); logg.scrollTop = logg.scrollHeight; }
  }

  // ---------- specialistens rum ----------
  function specRum(id) {
    const p = spec(id);
    return `
      <div class="rum-huvud"><div><span class="etikett">${esc(p.roll)}s rum</span><h1 id="rubrik">${esc(p.namn)}, ${esc(p.roll)}</h1><p class="dim">Anställd enligt planen. Rummet tändes samma dag.</p></div></div>
      <div class="enkelt">
        <div class="spec">
          <div class="passerkort"><div class="strip"></div><img src="${bild(p.av)}" alt="Porträtt av ${esc(p.namn)}"><div><b>${esc(p.namn)}</b><small>${esc(p.roll)} · ${esc(P.firma)}</small></div></div>
          <div class="fakta">
            <div><span class="etikett">Varför ${esc(p.namn)} finns här</span><p>${esc(p.skal)}</p></div>
            <div><span class="etikett">Första uppdraget, samma dag</span><p>${esc(p.uppdrag)}</p></div>
            <div><span class="etikett">Senaste leveransen</span><p>${esc(p.leverans)}</p></div>
            <div><button class="knapp" type="button" id="prataSpec">Prata med ${esc(p.namn)}</button></div>
          </div>
        </div>
      </div>`;
  }
  function moteRum() {
    const runt = [P.avatarN, ...PLAN.filter((p) => anstalld(p.id)).map((p) => p.av)];
    return `
      <div class="rum-huvud"><div><span class="etikett">Upplåst på nivå 3</span><h1 id="rubrik">Mötesrummet</h1><p class="dim">Flera kollegor kring samma bord. Var och en säger sitt, ${esc(P.namn)} skriver anteckningen.</p></div></div>
      <div class="enkelt">
        <div class="bord-runt" aria-label="Runt bordet">${runt.map((n) => `<img src="${bild(n)}" alt="">`).join("")}<span class="dim" style="font-size:.9rem;margin-left:6px">och du, vid kortänden</span></div>
        <div class="motestyper">
          <div class="motestyp"><span class="etikett">Projektgenomgång</span><b>Hur gick Brf Tallen?</b><p>Var och en från sitt håll: kalkylen, betalningen, kunden.</p></div>
          <div class="motestyp"><span class="etikett">Specifik förbättring</span><b>Varför faktureras ÄTA sent?</b><p>Ett problem, tre perspektiv, ett förslag.</p></div>
          <div class="motestyp"><span class="etikett">Vad händer härnäst</span><b>Vårens jobb</b><p>Slutar i ett beslut, och beslutet blir en rutin.</p></div>
        </div>
        <div><button class="knapp" type="button" id="hallMote">Kalla till möte</button></div>
      </div>`;
  }

  // ---------- rita ----------
  const RUMNAMN = (id) => id === "vd" ? "VD-kontoret" : id === "assistent" ? `${gen(P.namn)} kontor` : id === "mote" ? "Mötesrummet" : spec(id.slice(5)).roll;
  function rita() {
    $("firmaTopp").textContent = P.firma;
    document.title = `Kontoren · ${P.firma}`;
    $("toppVar").textContent = `Plan 2 · ${RUMNAMN(S.rum)}`;
    $("planknappRum").textContent = RUMNAMN(S.rum);
    document.querySelectorAll(".vaxel [data-niva]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.niva === S.niva)));
    const rum = $("rum");
    rum.innerHTML = S.rum === "vd" ? vdKontoret() : S.rum === "assistent" ? assistentensKontor() : S.rum === "mote" ? moteRum() : specRum(S.rum.slice(5));
    ritaPlan();
    koppla();
  }
  function koppla() {
    const q = (id) => $(id);
    if (q("nastaKnapp")) q("nastaKnapp").onclick = () => nastaSteg().gor();
    if (q("hog")) q("hog").onclick = () => { S.visaUtkast = !S.visaUtkast; S.fokusUtkast = null; rita(); if (S.visaUtkast) $("utkast").scrollIntoView({ block: "nearest", behavior: "smooth" }); };
    document.querySelectorAll("[data-godkann]").forEach((b) => b.onclick = () => {
      S.godkanda.add(b.dataset.godkann);
      rita();
      toast(b.dataset.godkann === "u-offert" ? "Godkänd. Bertil skickar offerten i dag." : "Godkänd och stämplad.");
    });
    document.querySelectorAll("[data-andra]").forEach((b) => b.onclick = () => {
      const rad = $(b.dataset.andra);
      if (!rad.querySelector(".not")) rad.insertAdjacentHTML("beforeend", `<p class="not">I portalen öppnar det här samtalet med den som skrev utkastet, med utkastet förifyllt.</p>`);
    });
    if (q("skriv")) {
      const t = q("skrivText");
      if (S.forifyllt) { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); }
      t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); q("skriv").requestSubmit(); } });
      q("skriv").onsubmit = (e) => {
        e.preventDefault();
        const text = t.value.trim(); if (!text) return;
        t.value = ""; S.forifyllt = "";
        sag(text, "jag");
        const svar = SVAR[S.svarIndex++ % SVAR.length];
        setTimeout(() => sag(svar), 650);
      };
      const logg = q("logg"); logg.scrollTop = logg.scrollHeight;
    }
    if (q("motesKnapp")) q("motesKnapp").onclick = () => {
      sag(S.niva >= 3
        ? "Veckomötet. Tre punkter, tio minuter. Förra veckan höll rutinerna för tredje veckan i rad, så mötesrummet är öppet nu. Den här veckan: Bertils offert. Ska vi ta in Kundsvararen?"
        : `Veckomötet. Tre punkter, tio minuter. Förra veckan: Gunnar gick, jag kom. Den här veckan: Brf Tallen. Har du underlaget, ${P.chef}?`);
      $("skrivText").focus({ preventScroll: true });
    };
    document.querySelectorAll("[data-anstall]").forEach((b) => b.onclick = () => anstall([b.dataset.anstall]));
    if (q("alla")) q("alla").onclick = () => { S.bekrafta = true; rita(); $("allaJa").focus({ preventScroll: true }); };
    if (q("allaNej")) q("allaNej").onclick = () => { S.bekrafta = false; rita(); };
    if (q("allaJa")) q("allaJa").onclick = () => { S.alla = true; S.bekrafta = false; anstall(PLAN.filter((p) => !anstalld(p.id)).map((p) => p.id), true); };
    if (q("prataSpec")) q("prataSpec").onclick = () => toast("I portalen har varje anställd ett eget samtal i sitt rum. I skissen pratar bara VD-assistenten.");
    if (q("hallMote")) q("hallMote").onclick = () => toast("I portalen svarar var och en för sig, och sedan skriver VD-assistenten anteckningen.");
  }
  function anstall(ids, alla) {
    ids.forEach((id) => S.anstallda.add(id));
    rita();
    if (alla) sag("Alla flyttar in i dag. Jag presenterar dem en i taget ändå, annars vet ingen vem som svarar på vad.");
    ids.forEach((id, i) => {
      const p = spec(id);
      setTimeout(() => sag(`Det här är ${p.namn}, er nya ${p.roll.toLowerCase()}. Varför: ${p.skal.charAt(0).toLowerCase() + p.skal.slice(1)} Första uppdraget, i dag: ${p.uppdrag.charAt(0).toLowerCase() + p.uppdrag.slice(1)}`), 300 + i * 500);
    });
    toast(ids.length > 1 ? "Rummen tänds på våningen." : `${spec(ids[0]).namn} har flyttat in. Rummet är tänt.`);
  }
  function ga(rum) {
    S.rum = rum; S.visaUtkast = rum === "vd" ? S.visaUtkast : false;
    if (rum !== "vd") S.fokusUtkast = null;
    stangPlan();
    rita();
    window.scrollTo({ top: 0 });
    $("rum").focus({ preventScroll: true });
    const u = new URL(location.href); u.searchParams.set("rum", rum === "vd" ? "vd" : rum); u.searchParams.set("niva", S.niva);
    history.replaceState(null, "", u);
  }
  function fokusera(id) { const el = $(id); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); const k = el.querySelector("button"); if (k) k.focus({ preventScroll: true }); } }
  let toastTimer = 0;
  function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("syns"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("syns"), 3200); }

  // ---------- mobil: planritningen fälls ut ----------
  function stangPlan() { $("plan").classList.remove("oppen"); $("planknapp").setAttribute("aria-expanded", "false"); }
  $("planknapp").onclick = () => { const o = $("plan").classList.toggle("oppen"); $("planknapp").setAttribute("aria-expanded", String(o)); };

  // ---------- demo-växeln ----------
  document.querySelectorAll(".vaxel [data-niva]").forEach((b) => b.onclick = () => { sattNiva(+b.dataset.niva); ga(S.rum); });
  $("nollstall").onclick = () => { sattNiva(S.niva); ga("vd"); toast("Skissen började om."); };

  // ---------- start ----------
  const sp = new URLSearchParams(location.search);
  sattNiva(sp.get("niva") === "3" ? 3 : 1);
  const startRum = sp.get("rum") || "vd";
  S.rum = rumOppet(startRum) && (["vd", "assistent", "mote"].includes(startRum) || /^spec:(offert|faktura|kund)$/.test(startRum)) ? startRum : "vd";
  rita();
})();
</script>
