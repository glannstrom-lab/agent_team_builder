<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mitt AI-team · Kundportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="portal.css" />
<!-- PWA: installerbar app -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F1ECE3" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mitt AI-team" />
</head>
<body>
<div id="root"></div>
<!-- Register över tillgängliga team (för kundväljaren). app.js laddar sedan
     teams/<slug>.js dynamiskt baserat på ?team=<slug>. -->
<script src="../avatars.js"></script>
<!-- Delad Claude-klient (window.ATBClaude) — samma som buildern använder -->
<script src="../atb-claude.js"></script>
<!-- Svenska företagsdatum till årshjulet (valbart per team) -->
<script src="deadlines-se.js"></script>
<script src="teams/index.js"></script>
<script src="app.js"></script>
<script>
  // Registrera service worker så portalen blir installerbar och funkar offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
